name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # A garder aligne sur le FROM du Dockerfile : aucun ecosysteme Dependabot
          # ne suit ce champ, alors qu'il suit l'image. Sans quoi on teste sur une
          # version et on livre sur une autre.
          deno-version: "2.9.6"

      - name: Install dependencies
        run: deno install --frozen

      - name: Build assets (CSS + client JS)
        run: deno task build

      - name: Lint
        run: deno task lint

      - name: Format check
        run: deno task fmt:check

      - name: Type check
        run: deno task check

      - name: Tests
        run: deno task test
