name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.5"

      - name: Install dependencies
        run: deno install --frozen

      - name: Build assets (CSS + client JS)
        run: deno task build

      - name: Lint
        run: deno task lint

      - name: Format check
        run: deno task fmt:check

      - name: Type check
        run: deno task check

      - name: Tests
        run: deno task test
